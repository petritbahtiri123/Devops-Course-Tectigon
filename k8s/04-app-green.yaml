apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
  namespace: final-task
spec:
  replicas: 1
  selector:
    matchLabels:
      app: final-task-app
      color: green
  template:
    metadata:
      labels:
        app: final-task-app
        color: green
    spec:
      containers:
        - name: app
          image: final-task-app:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v2"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "appdb"
            - name: DB_USER
              value: "appuser"
            - name: DB_PASSWORD
              value: "apppass"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: app-green
  namespace: final-task
spec:
  selector:
    app: final-task-app
    color: green
  ports:
    - port: 5000
      targetPort: 5000
